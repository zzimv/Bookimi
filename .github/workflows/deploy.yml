name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bookimi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Внутри Dockerfile: next build + проверка бандла на секреты
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }},${{ env.IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ needs.build.outputs.tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: TAG
          script: |
            set -e
            cd /opt/bookimi
            PREV=$(grep -E '^IMAGE_TAG=' .env | cut -d= -f2)
            echo "$PREV" > .prev_tag
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${TAG}/" .env
            rollback() {
              echo "ROLLBACK to ${PREV}"
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREV}/" .env
              docker compose pull web worker && docker compose up -d
              exit 1
            }
            docker compose pull web worker || rollback
            docker compose up -d || rollback
            docker compose run --rm web node_modules/.bin/prisma migrate deploy || rollback
            for i in $(seq 1 20); do
              if curl -fsS "https://$(grep -E '^DOMAIN=' .env | cut -d= -f2)/api/health" >/dev/null; then
                echo "deploy ok: ${TAG}"; docker image prune -f; exit 0
              fi
              sleep 5
            done
            rollback
