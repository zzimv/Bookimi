# VPS 2 vCPU / 2 ГБ RAM. Лимиты памяти в сумме ~1,8 ГБ.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${IMAGE:-ghcr.io/OWNER/bookimi}:${IMAGE_TAG:-latest}
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging
  volumes:
    - storage:/app/storage   # только для STORAGE_DRIVER=local; в продакшне — Yandex Object Storage

services:
  web:
    <<: *app
    command: ["node", "server.js"]
    mem_limit: 600m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    mem_limit: 1g     # Chromium для PDF; мультфильм — ffmpeg по одной сцене (пик ~0,5–0,7 ГБ)
    shm_size: 256m

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 400m
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-www.${DOMAIN}}
      # Админка: свой хост, белый список IP (CIDR через пробел) и подсеть VPN; базовая авторизация — по флагу
      ADMIN_HOST: ${ADMIN_HOST:-admin.${DOMAIN}}
      ADMIN_ALLOW_IPS: ${ADMIN_ALLOW_IPS:-127.0.0.1/32}
      ADMIN_VPN_SUBNET: ${ADMIN_VPN_SUBNET:-10.13.13.0/24}
      ADMIN_BASIC_AUTH: ${ADMIN_BASIC_AUTH:-off}
      ADMIN_BASIC_USER: ${ADMIN_BASIC_USER:-staff}
      ADMIN_BASIC_HASH: ${ADMIN_BASIC_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  # VPN для сотрудников (README, «Безопасность админки»): профиль vpn — docker compose --profile vpn up -d wireguard.
  # Сеть хоста: клиенты получают адреса 10.13.13.x, и Caddy видит именно их (для ADMIN_VPN_SUBNET).
  wireguard:
    image: lscr.io/linuxserver/wireguard:1.0.20210914
    profiles: ["vpn"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Moscow
      SERVERURL: ${WG_SERVER_URL:-${DOMAIN}}
      SERVERPORT: "51820"
      PEERS: ${WG_PEERS:-owner,operator}
      INTERNAL_SUBNET: 10.13.13.0
      # Через туннель — только VPN и сам сервер (админка), остальной интернет — напрямую
      ALLOWEDIPS: 10.13.13.0/24,${WG_SERVER_PUBLIC_IP:-0.0.0.0}/32
      PERSISTENTKEEPALIVE_PEERS: all
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    logging: *logging

volumes:
  storage:
  pgdata:
  caddy_data:
  caddy_config:
